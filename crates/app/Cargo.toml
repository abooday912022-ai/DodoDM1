[package]
name = "dodo-dm1"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DODO DM1 – download manager (desktop app)"
build = "build.rs"

[features]
default = []
classic = ["dep:slint", "dep:slint-build"]

[dependencies]
swiftget-engine = { path = "../engine" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# React WebView2 desktop shell
wry = { version = "0.57", default-features = false }
tao = { version = "0.37", features = ["rwh_06"] }
# Optional classic Slint UI
slint = { version = "~1.18", features = ["raw-window-handle-06", "unstable-winit-030"], optional = true }
tiny_http = "0.12"
arboard = { version = "3", default-features = false }
rfd = "0.15"
open = "5"
url = "2"
chrono = "0.4"
sha2 = "0.10"
tokio-util = "0.7"
sys-locale = "0.3"

[build-dependencies]
slint-build = { version = "~1.18", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "DodoDM1"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
] }
